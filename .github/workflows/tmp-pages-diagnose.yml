name: TMP pages diagnose
on:
  pull_request:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: DNS
        run: |
          for h in pr-11.artisan-preview.pages.dev 2985e421.artisan-preview.pages.dev artisan-preview.pages.dev; do
            echo "--- $h"
            getent hosts "$h" || echo "  no A record"
          done
      - name: HTTP
        run: |
          for u in https://pr-11.artisan-preview.pages.dev https://2985e421.artisan-preview.pages.dev https://artisan-preview.pages.dev; do
            echo "--- $u"
            curl -sS -o /dev/null -w '  http=%{http_code} ip=%{remote_ip}\n' --max-time 20 "$u" 2>&1 | tail -3 || echo "  curl exit $?"
          done
      - name: Project keys
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/artisan-preview" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "
import sys,json
r=(json.load(sys.stdin).get('result') or {})
print('all keys:', sorted(r.keys()))
for k,v in sorted(r.items()):
    if any(t in k.lower() for t in ('preview','access','deployment_settings','config')):
        print(f'  {k} = {json.dumps(v)[:200]}')
"
      - name: Project via API
        run: |
          echo "--- project"
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/artisan-preview" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('success',d.get('success'));print('subdomain',r.get('subdomain'));print('domains',r.get('domains'));print('production_branch',r.get('production_branch'));print('preview setting',r.get('preview_deployment_setting'));print('canonical',(r.get('canonical_deployment') or {}).get('url'))"
          echo "--- deployments"
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/artisan-preview/deployments?per_page=5" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(' ',x.get('id','')[:8],x.get('environment'),x.get('url'),x.get('latest_stage',{}).get('name'),x.get('latest_stage',{}).get('status')) for x in (d.get('result') or [])]"
